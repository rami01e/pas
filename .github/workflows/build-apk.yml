name: Build & Release

on:
  push:
    branches:
      - main
    tags:
      - '*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Set up NDK and CMake
        timeout-minutes: 15
        run: |
          set -e
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          NDK_DIR="$ANDROID_HOME/ndk/27.0.12077973"
          CMAKE_DIR="$ANDROID_HOME/cmake/3.22.1"

          if [ -f "$NDK_DIR/source.properties" ]; then
            echo "NDK present, skipping download: $(grep -i '^Pkg.Revision' "$NDK_DIR/source.properties" || true)"
          else
            echo "NDK missing - installing with retries"
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            for i in 1 2 3; do
              if timeout 420 "$SDKMANAGER" --install "ndk;27.0.12077973" > /tmp/ndk-install.log 2>&1; then break; fi
              echo "attempt $i failed:"; tail -n 20 /tmp/ndk-install.log || true
              sleep 15
            done
          fi

          if [ -d "$CMAKE_DIR" ]; then
            echo "CMake 3.22.1 present, skipping download"
          else
            for i in 1 2 3; do
              if timeout 240 "$SDKMANAGER" --install "cmake;3.22.1" > /tmp/cmake-install.log 2>&1; then break; fi
              echo "attempt $i failed:"; tail -n 20 /tmp/cmake-install.log || true
              sleep 15
            done
          fi

          test -f "$NDK_DIR/source.properties" || {
            echo "NDK install verification failed (ndk;27.0.12077973 not present)"
            exit 1
          }
          test -d "$CMAKE_DIR" || {
            echo "CMake install verification failed (cmake;3.22.1 not present)"
            exit 1
          }

      - name: Use github keystore for release
        run: |
          echo 'RELEASE_STORE_FILE=github.keystore' >> gradle.properties
          echo 'RELEASE_STORE_PASSWORD=123456789' >> gradle.properties
          echo 'RELEASE_KEY_ALIAS=key' >> gradle.properties
          echo 'RELEASE_KEY_PASSWORD=123456789' >> gradle.properties

      - name: Build Release APK
        run: |
          set -o pipefail
          ./gradlew assembleRelease --stacktrace 2>&1 | tee buildlog.txt

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buildlog
          path: buildlog.txt
          if-no-files-found: ignore

      - name: Extract version
        id: ver
        if: success()
        run: |
          VERSION_NAME=$(grep -oP 'versionName\s*"\K[^"]+' app/build.gradle | head -1)
          VERSION_CODE=$(grep -oP 'versionCode\s+\K[0-9]+' app/build.gradle | head -1)
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v${VERSION_NAME}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
            echo "name=v${VERSION_NAME} (${SHORT_SHA})" >> "$GITHUB_OUTPUT"
          fi
          echo "versionName=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "versionCode=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "Resolved: v$VERSION_NAME vc=$VERSION_CODE sha=$SHORT_SHA"

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-release-v${{ steps.ver.outputs.versionName }}
          path: app/build/outputs/apk/release/app-release.apk

      - name: Publish Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.name }}
          files: app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
          draft: false
          prerelease: false